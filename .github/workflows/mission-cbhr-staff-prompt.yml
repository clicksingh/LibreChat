name: CBHR staff prompt source verification

on:
  pull_request:
    paths:
      - 'packages/api/src/agents/run.ts'
      - 'packages/api/src/agents/staffWorkstationContract.ts'
      - 'packages/api/src/agents/staffWorkstationContract.spec.ts'
      - '.github/workflows/mission-cbhr-staff-prompt.yml'
  push:
    branches:
      - 'mission/workspace-c1-staff-contract-remote-20261017'

permissions:
  contents: read

jobs:
  staff-prompt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install exact locked dependencies
        run: npm ci
      - name: Build dependent packages
        run: |
          npm run build:data-provider
          npm run build:data-schemas
      - name: Staff contract focused regression
        working-directory: packages/api
        run: npx jest --ci --runInBand --coverage=false src/agents/staffWorkstationContract.spec.ts
      - name: TypeScript API build
        run: npm run build:api
      - name: Source whitespace verification
        run: git diff --check
